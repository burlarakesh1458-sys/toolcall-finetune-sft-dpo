[project]
name = "toolcall-ft"
version = "0.1.0"
description = "Tool-call fine-tuning: prompt baseline -> LoRA SFT -> DPO, with a correctness-based scorer"
authors = [{ name = "Rakesh Burla", email = "burlarakesh1458@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

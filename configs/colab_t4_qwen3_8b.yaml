# Free Colab T4 (16 GB, no bf16) variant of the Qwen3-8B QLoRA config. NOT EXECUTED here.
# fp16 compute, batch 1 x grad-accum 16, shorter sequences, fewer DPO prompts to fit the
# ~2-3 h free-tier session. If you hit OOM, drop max_length to 768 or use Qwen3-4B.
run_name: colab_t4_qwen3_8b
seed: 42
output_dir: outputs/colab_t4_qwen3_8b
results_dir: results/colab_t4_qwen3_8b

model:
  base: Qwen/Qwen3-8B
  dtype: float16
  compute_dtype: float16
  load_in_4bit: true
  attn_implementation: sdpa
  chat_template_kwargs: {enable_thinking: false}   # Qwen3: no <think> block for this task

data:
  raw_path: data/raw/glaive-function-calling-v2.json
  dir: data/processed
  total: 4000
  refusal_frac: 0.2
  synthetic_negative_frac: 0.5
  val_size: 400
  test_size: 600
  max_tools_chars: 1200
  max_per_tool: 40
  train_limit: 2000
  val_limit: 100
  test_limit: 300
  max_length: 896

eval:
  batch_size: 8
  max_new_tokens: 128

sft:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  num_train_epochs: 1
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 5
  eval_steps: 40
  gradient_checkpointing: true
  bf16: false
  fp16: true

dpo:
  n_prompts: 300
  n_samples: 4
  temperature: 1.0
  top_p: 0.95
  gold_anchor: true
  beta: 0.1
  learning_rate: 5.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 896
  max_prompt_length: 768
  logging_steps: 2
  bf16: false
  fp16: true

report_to: [tensorboard]
